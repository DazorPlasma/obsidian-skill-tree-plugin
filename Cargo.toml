[package]
name = "obsidian-skill-tree-plugin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = "s"

[package.metadata.wasm-pack.profile.release]
# The bundled Binaryen validator rejects the bulk-memory instructions emitted by this toolchain.
wasm-opt = false
